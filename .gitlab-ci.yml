image: node:20

stages:
  - install
  - test
  - build

# GitLab CI/CD variables are exposed to every job as environment variables,
# so no .env file is written, printed or stored as an artifact.
# Unit tests do not need any secrets; the frontend build only needs
# REACT_APP_API_URL (set it as a CI/CD variable).
variables:
  NODE_ENV: test
  GENERATE_SOURCEMAP: 'false'

cache:
  key: '$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG'
  paths:
    - backend/node_modules/
    - frontend/node_modules/

install_backend:
  stage: install
  script:
    - cd backend
    - npm install
  artifacts:
    paths:
      - backend/node_modules/
    expire_in: 1 day

install_frontend:
  stage: install
  script:
    - cd frontend
    - npm install --legacy-peer-deps
  artifacts:
    paths:
      - frontend/node_modules/
    expire_in: 1 day

test_backend:
  stage: test
  script:
    - cd backend
    - npm test
  needs: [install_backend]

test_frontend:
  stage: test
  script:
    - cd frontend
    - npm test
  needs: [install_frontend]

build_backend:
  stage: build
  script:
    - cd backend
    - npm run build
  artifacts:
    paths:
      - backend/dist/
    expire_in: 7 days
  needs: [install_backend]

build_frontend:
  stage: build
  script:
    - cd frontend
    - npm run build
  artifacts:
    paths:
      - frontend/build/
    expire_in: 7 days
  needs: [install_frontend]
